spring.application.name=societyManagement

spring.datasource.url=jdbc:postgresql://localhost:5432/society_management_db
spring.datasource.username=postgres
spring.datasource.password=123456

# JPA ? schema is owned by Flyway migrations, not Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT — override app.jwt.secret via the JWT_SECRET env var in any real deployment
app.jwt.secret=${JWT_SECRET:change-this-dev-jwt-secret-to-a-long-random-value-before-prod!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cache — role hierarchy lookups; the TTL bounds staleness after manual SQL edits to role tables
spring.cache.cache-names=rolePermissions,roleSubordinates
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

server.port=8080

# Visitor photos — ImageFormat.MAX_BYTES (5MB) is the real limit; these just stop larger requests early
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

logging.level.org.devvikram.societymanagement=DEBUG
logging.level.org.springframework.security=INFO

# Time zone for report date ranges and exported timestamps (societies are in India).
app.report.zone=${REPORT_ZONE:Asia/Kolkata}

# Push — "logging" (default: logs only, no Firebase needed) or "fcm". With fcm, the service-account JSON
# is read from secrets/firebase-service-account.json (git-ignored) unless FIREBASE_CREDENTIALS points
# elsewhere; set it blank to use Application Default Credentials. The Android channel id must match the
# one the app creates.
app.push.provider=${PUSH_PROVIDER:logging}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS:secrets/firebase-service-account.json}
app.push.android-channel-id=${PUSH_ANDROID_CHANNEL:society_default}
