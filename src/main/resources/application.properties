spring.application.name=societyManagement

spring.datasource.url=jdbc:postgresql://localhost:5432/society_management_db
spring.datasource.username=postgres
spring.datasource.password=123456

# JPA ? schema is owned by Flyway migrations, not Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT — override app.jwt.secret via the JWT_SECRET env var in any real deployment
app.jwt.secret=${JWT_SECRET:change-this-dev-jwt-secret-to-a-long-random-value-before-prod!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080

logging.level.org.devvikram.societymanagement=DEBUG
logging.level.org.springframework.security=INFO