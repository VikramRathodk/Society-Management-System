# Production overrides, active with SPRING_PROFILES_ACTIVE=prod. Values with no default here must be set
# as environment variables, or the app refuses to start. See README.md for the full list.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HS256 needs a secret of at least 32 bytes, e.g. `openssl rand -base64 48`.
app.jwt.secret=${JWT_SECRET}

spring.jpa.properties.hibernate.format_sql=false
logging.level.org.devvikram.societymanagement=INFO

# Behind a reverse proxy (nginx, a cloud load balancer): trust its X-Forwarded-* headers.
server.forward-headers-strategy=framework
